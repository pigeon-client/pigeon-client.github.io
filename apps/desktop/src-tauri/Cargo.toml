[package]
name = "pigeon"
version = "0.1.19"
description = "Pigeon"
authors = ["k1n1"]
homepage = "https://trypigeon.dev"
repository = "https://github.com/pigeon-client/pigeon"
license = "MIT"
edition = "2021"

[lib]
name = "pigeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "6"
url = "2"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Do not set panic = "abort" — macos.rs uses catch_unwind.

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["std", "NSKeyValueCoding", "NSValue", "NSObject"] }
objc2-web-kit = { version = "0.3", features = ["std", "WKWebView"] }
