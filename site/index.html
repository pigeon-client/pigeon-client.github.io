    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Pigeon",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A free, open-source desktop API client that organizes itself — auto-named tabs, requests filed by domain, auto-saved history. With environments, collections, and cURL import.",

        "downloadUrl": "https://github.com/pigeon-client/pigeon/releases/latest",
        "license": "https://github.com/pigeon-client/pigeon/blob/main/LICENSE"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Pigeon a free alternative to Postman?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Pigeon is completely free and open source. There are no paid tiers, no account requirements, and no cloud sync — your data stays on your machine."
            }
          },
          {
            "@type": "Question",
            "name": "What platforms does Pigeon support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pigeon is available for macOS today (Apple Silicon and Intel) — install it with a single curl command or download the .dmg from GitHub releases. Linux and Windows builds are on the roadmap — watch releases on GitHub to be notified."
            }
          },
          {
            "@type": "Question",
            "name": "Can I import my existing requests?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Paste any cURL command into the URL bar or import modal and Pigeon builds the full request — method, headers, auth, and body. You can also copy any request back out as cURL."
            }
          }
        ]
      }
    </script>
