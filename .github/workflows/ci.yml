name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/site/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'apps/site/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Build
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm ci:check

      - name: Import cycle check
        run: pnpm check:cycles

      - name: Build (tsc + vite)
        run: pnpm build
