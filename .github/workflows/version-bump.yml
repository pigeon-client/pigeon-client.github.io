name: Release on merge

# Every push to main (except the bot's own bump / docs / site) bumps the patch
# version from .version.json, commits it, and pushes a `v<version>` tag. The tag
# fires release.yml, which builds all platforms and publishes the release.
#
# The tag is pushed with RELEASE_TOKEN (a PAT) on purpose: a tag pushed with the
# default GITHUB_TOKEN does NOT trigger another workflow. Set the repo secret
# RELEASE_TOKEN to a fine-grained PAT with `contents: write`.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.version.json'
      - '**.md'
      - 'apps/site/**'
  workflow_dispatch:

jobs:
  bump:
    name: Bump patch + tag
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT so the pushed tag triggers release.yml (GITHUB_TOKEN would not).
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          MAJOR=$(jq -r '.major' .version.json)
          MINOR=$(jq -r '.minor' .version.json)
          PATCH=$(jq -r '.patch' .version.json)
          NEW_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "new_version=${VERSION}" >> "$GITHUB_OUTPUT"

          jq ".patch = ${NEW_PATCH}" .version.json > .version.tmp && mv .version.tmp .version.json
          jq ".version = \"${VERSION}\"" apps/desktop/package.json > pkg.tmp && mv pkg.tmp apps/desktop/package.json
          jq ".version = \"${VERSION}\"" apps/desktop/src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp apps/desktop/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" apps/desktop/src-tauri/Cargo.toml

      - name: Commit, tag, and push
        run: |
          V="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
          git commit -m "chore: release v${V}

          [version-bump]

          Co-authored-by: CommandCodeBot <noreply@commandcode.ai>"
          git tag "v${V}"
          git push origin HEAD:main
          git push origin "v${V}"
