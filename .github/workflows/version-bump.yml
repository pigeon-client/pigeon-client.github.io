name: Version Bump

on:
  push:
    branches: [main]
    paths-ignore:
      - '.version.json'
      - '**.md'
      - 'site/**'

jobs:
  bump:
    name: Bump Patch Version
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        id: bump
        run: |
          MAJOR=$(jq -r '.major' .version.json)
          MINOR=$(jq -r '.minor' .version.json)
          PATCH=$(jq -r '.patch' .version.json)
          NEW_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "new_version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Update .version.json
          jq ".patch = ${NEW_PATCH}" .version.json > .version.tmp && mv .version.tmp .version.json

          # Update package.json
          jq ".version = \"${VERSION}\"" package.json > pkg.tmp && mv pkg.tmp package.json

          # Update tauri.conf.json
          jq ".version = \"${VERSION}\"" src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          # Update Cargo.toml (semver string, need to escape dots)
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version.json package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump to v${{ steps.bump.outputs.new_version }}

          [version-bump]

          Co-authored-by: CommandCodeBot <noreply@commandcode.ai>"
          git push
