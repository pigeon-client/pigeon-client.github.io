name: Deploy Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'scripts/install.sh'
      - 'packages/ui/**'
      - 'packages/brand/**'
  # release.yml dispatches this on `main` after publishing (a `release`-event run
  # would execute on the tag ref, which the github-pages environment blocks).
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest release data
        run: |
          curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o src/release.json \
            https://api.github.com/repos/${{ github.repository }}/releases/latest || true
        working-directory: apps/site

      - name: Sync install.sh into site public/
        run: |
          mkdir -p apps/site/public
          cp scripts/install.sh apps/site/public/install.sh

      - name: Build
        run: pnpm --filter pigeon-site build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
